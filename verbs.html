<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verb Lookup · Rioplatense</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app app-wide">
      <header>
        <div class="header-top">
          <div id="locale-toggle"></div>
        </div>
        <p class="back-link"><a id="back-link" href="index.html" data-i18n="nav.home">← Home</a></p>
        <h1 data-i18n="page.verbs.heading">Verb Lookup</h1>
        <p class="subtitle" data-i18n="page.verbs.subtitle">Browse all verbs — reflexives are tagged separately from regular conjugation verbs</p>
      </header>

      <div class="filter-tabs" role="tablist" data-i18n-aria="verbs.filterAria">
        <button type="button" class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true" data-i18n="verbs.filterAll">
          All
        </button>
        <button type="button" class="filter-tab" data-filter="non-reflexive" role="tab" aria-selected="false" data-i18n="verbs.filterNonReflexive">
          Non-reflexive
        </button>
        <button type="button" class="filter-tab" data-filter="reflexive" role="tab" aria-selected="false" data-i18n="verbs.filterReflexive">
          Reflexive only
        </button>
      </div>

      <div class="field">
        <label for="verb-search" data-i18n="verbs.searchLabel">Search</label>
        <input
          id="verb-search"
          type="search"
          data-i18n-placeholder="verbs.searchPlaceholder"
          placeholder="Search by infinitive or English…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <p id="verb-list-status" class="field-hint" aria-live="polite"></p>
      <div id="verb-list" class="verb-list"></div>

      <div
        id="verb-detail-modal"
        class="modal-overlay"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="verb-detail-title"
      >
        <section class="modal-dialog modal-dialog-wide">
          <div id="verb-detail-body"></div>
          <button type="button" id="verb-detail-close" class="primary-action" data-i18n="settings.close">Close</button>
        </section>
      </div>
    </main>

    <script type="module" src="src/verbs.js"></script>
  </body>
</html>
